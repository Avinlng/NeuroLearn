<!DOCTYPE html>
<html>
<head>
    <title>Firebase Test</title>
</head>
<body>
    <h1>Firebase Test</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signup">Sign Up</button>
    <div id="result"></div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyB4Sd4MO7I8HeX42X0CZxbqLtZp7wLwkbU",
            authDomain: "neurolearn-be081.firebaseapp.com",
            projectId: "neurolearn-be081",
            storageBucket: "neurolearn-be081.firebasestorage.app",
            messagingSenderId: "852782942251",
            appId: "1:852782942251:web:77a059e9257606022d426e",
            databaseURL: "https://neurolearn-be081-default-rtdb.firebaseio.com/"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('signup').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const user = await createUserWithEmailAndPassword(auth, email, password);
                document.getElementById('result').innerHTML = '✅ Success: ' + user.user.email;
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
            }
        };
    </script>
</body>
</html>
